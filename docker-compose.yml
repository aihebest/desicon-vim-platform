# Local development services for the VIM platform (NOT for production).
#
#   sqlserver : SQL Server 2022 in a container, standing in for Azure SQL.
#   azurite   : Microsoft's Azure Storage emulator, standing in for Blob Storage
#               (and the Functions host storage).
#
# The SA password is read from a file named .env next to this file. .env is
# git-ignored; never commit a real password. Create it once (PowerShell):
#
#   Set-Content -Path .env -Value "MSSQL_SA_PASSWORD=<a strong password, 8+ chars, upper/lower/digit/symbol>"
#
# Start:  docker compose up -d      Stop:  docker compose down
# Wipe all local data as well:  docker compose down -v

name: desicon-vim

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vim-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Create a .env file with MSSQL_SA_PASSWORD=... (see the comment at the top of docker-compose.yml)}"
    ports:
      - "1433:1433"
    volumes:
      - vim-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: vim-azurite
    # --skipApiVersionCheck lets newer Azure SDKs talk to the emulator.
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    volumes:
      - vim-azurite-data:/data
    restart: unless-stopped

volumes:
  vim-sql-data:
  vim-azurite-data:
